name: Validate site

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Validate content
        run: bundle exec ruby script/validate_content.rb
      - name: Build site
        run: bundle exec jekyll build --strict_front_matter
